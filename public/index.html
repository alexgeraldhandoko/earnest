<script>
/* Installed-PWA sizing: with the translucent status bar the app owns the whole
   physical screen, but iOS can report a stale, status-bar-short layout viewport
   on cold launch (dvh/innerHeight all share it). screen.height is the hardware
   constant and is never stale, so when running standalone we size the shell
   from it. In a browser tab we fall back to normal dynamic viewport units. */
(function () {
  var root = document.documentElement;
  var standalone = navigator.standalone === true ||
    (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  var set = function () {
    if (standalone && screen.height > 0) root.style.setProperty("--app-h", screen.height + "px");
    else root.style.removeProperty("--app-h");
  };
  set();
  addEventListener("resize", set);
  addEventListener("orientationchange", set);
})();
</script>
