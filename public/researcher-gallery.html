<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Researcher profile pictures — review</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fafafa;color:#1a1a1a;padding:24px 16px 64px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:#666;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e4e4e4;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#888}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:top center;display:block;background:#eee}
.meta{padding:8px 10px}
.num{font-size:13px;font-weight:600}
.tag{font-size:11px;color:#888;margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;padding:16px}
.overlay img{max-width:92%;max-height:78vh;object-fit:contain;border-radius:8px}
.cap{color:#ddd;font-size:13px;margin-top:12px}
.close{margin-top:14px;padding:8px 24px;background:#fff;color:#111;border:none;border-radius:8px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1>20 researcher profile pictures</h1>
<p class="sub">Real photographs, freely licensed (Wikimedia Commons), no AI. Click any photo to view it full-size.</p>
<div class="grid" id="grid"></div>
</div>
<script>
const photos=[
["01","Studio · scientist, glasses"],
["02","Outdoor park · green blouse"],
["03","Studio · striped shirt"],
["04","Dark studio · black top"],
["05","Studio · grey suit"],
["06","Studio · purple top, glasses"],
["07","Studio · blue blazer"],
["08","Office · black blazer"],
["09","White backdrop · striped blazer"],
["10","Neutral wall · blazer, pink shirt"],
["11","Event backdrop · suit, red tie"],
["12","Dark studio · blue suit"],
["13","Grey studio · senior, grey suit"],
["14","Urban outdoor · blazer, glasses"],
["15","Indoor · suit, blue tie"],
["16","Travel outdoor · casual, flowers"],
["17","Autumn outdoor · plaid blazer"],
["18","Office · grey blazer"],
["19","Dark studio · shirt, striped tie"],
["20","White backdrop · navy blazer"]
];
const grid=document.getElementById('grid');
photos.forEach(([n,tag])=>{
const c=document.createElement('div');
c.className='card';
c.innerHTML='<img loading="lazy" src="researcher-profile-pictures/researcher-'+n+'.jpg" alt="Researcher '+n+'"><div class="meta"><div class="num">Researcher '+n+'</div><div class="tag">'+tag+'</div></div>';
c.onclick=()=>{
const o=document.createElement('div');
o.className='overlay';
o.innerHTML='<img src="researcher-profile-pictures/researcher-'+n+'.jpg" alt="Researcher '+n+' full size"><div class="cap">Researcher '+n+' — '+tag+'</div><button class="close">Close</button>';
o.querySelector('.close').onclick=e=>{e.stopPropagation();o.remove()};
o.onclick=e=>{if(e.target===o)o.remove()};
document.body.appendChild(o);
};
grid.appendChild(c);
});
</script>
</body>
</html>
