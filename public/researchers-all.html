<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All researchers — real profile pictures</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fafafa;color:#1a1a1a;padding:24px 16px 64px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:#666;margin-bottom:16px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.bar input{flex:1;min-width:220px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
.count{font-size:12px;color:#888}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e4e4e4;border-radius:12px;overflow:hidden;cursor:pointer}
.card:hover{border-color:#888}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:top center;display:block;background:#eee}
.meta{padding:8px 10px}
.num{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;color:#888;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;padding:16px}
.overlay img{max-width:92%;max-height:74vh;object-fit:contain;border-radius:8px}
.cap{color:#eee;font-size:14px;margin-top:12px;text-align:center}
.cap small{color:#aaa;display:block;margin-top:4px;font-size:12px;max-width:640px}
.close{margin-top:14px;padding:8px 24px;background:#fff;color:#111;border:none;border-radius:8px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1 id="ttl">Researchers — real profile pictures</h1>
<p class="sub">Every photo is a real photograph from Wikimedia Commons (freely licensed, no AI). Click any to view full-size. Credits: <a href="photos/CREDITS-researchers.txt">CREDITS-researchers.txt</a></p>
<div class="bar"><input id="q" type="text" placeholder="Filter by name or institution…"><span class="count" id="count"></span></div>
<div class="grid" id="grid"></div>
</div>
<script>
let rows=[];
const grid=document.getElementById('grid'),q=document.getElementById('q'),count=document.getElementById('count');
function render(){
const f=q.value.trim().toLowerCase();
const vis=rows.filter(r=>!f||r.name.toLowerCase().includes(f)||r.org.toLowerCase().includes(f));
count.textContent=vis.length+' shown';
grid.innerHTML='';
vis.forEach(r=>{
const c=document.createElement('div');
c.className='card';
const img=document.createElement('img');
img.loading='lazy';img.src=r.photo;img.alt=r.name;
const meta=document.createElement('div');
meta.className='meta';
const n=document.createElement('div');n.className='num';n.textContent=r.name;
const t=document.createElement('div');t.className='tag';t.textContent=r.org;
meta.append(n,t);c.append(img,meta);
c.onclick=()=>{
const o=document.createElement('div');
o.className='overlay';
const big=document.createElement('img');big.src=r.photo;big.alt=r.name;
const cap=document.createElement('div');cap.className='cap';cap.textContent=r.name;
const s=document.createElement('small');s.textContent=r.org;cap.appendChild(s);
const btn=document.createElement('button');btn.className='close';btn.textContent='Close';
btn.onclick=e=>{e.stopPropagation();o.remove()};
o.onclick=e=>{if(e.target===o)o.remove()};
o.append(big,cap,btn);document.body.appendChild(o);
};
grid.appendChild(c);
});
}
fetch('researchers-gallery-data.json').then(r=>r.json()).then(d=>{rows=d;document.getElementById('ttl').textContent=rows.length+' researchers — real profile pictures';render()});
q.oninput=render;
</script>
</body>
</html>
